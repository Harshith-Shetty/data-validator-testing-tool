# Render blueprint: push this repo, then "New > Blueprint" and pick it.
# Railway and Fly.io need no config file at all — they build the Dockerfile
# directly and hand back a public https URL.
services:
  - type: web
    name: data-validator-testing-tool
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DVT_STORAGE_DIR
        value: /app/data
    # A disk keeps tests and run history between deploys; it needs a paid
    # instance type. Without it the app still runs, but storage resets on
    # every restart.
    # disk:
    #   name: dvt-storage
    #   mountPath: /app/data
    #   sizeGB: 1
